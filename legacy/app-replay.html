<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paddock Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14161a; --panel:#d6d6d0; --page:#b9b9b2; --line:#a9a9a2; --mute:#5b5e63;
  --soft:#e0483f; --med:#f2c230; --hard:#f4f4f0; --inter:#3fa65a; --wet:#3a7bd5;
  --purple:#8e44c8; --green:#2a8a45;
  --head:'Barlow Condensed',Impact,sans-serif; --body:'Barlow',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font:14px/1.35 var(--body);overflow:hidden}
button,select{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--ink);padding:4px 10px;cursor:pointer;border-radius:0}
button:hover{background:#c9c9c2}
button.on{background:var(--ink);color:var(--panel)}
select{background:var(--panel);border:1px solid var(--ink);padding:4px 6px;border-radius:0;max-width:260px}
a{color:var(--ink)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.head{font-family:var(--head);font-weight:700;letter-spacing:.02em;text-transform:uppercase}

header{height:48px;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--ink);color:var(--panel)}
header .logo{font:700 26px var(--head);letter-spacing:.04em;text-transform:uppercase}
header select{background:#2a2d33;color:var(--panel);border-color:#555}
.badge{font:500 11px var(--mono);padding:2px 6px;border:1px solid currentColor;white-space:nowrap}
.badge.live{color:#6fd48b}.badge.sim{color:#f2c230}
#ticker{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font:500 13px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tickFlag{width:12px;height:12px;flex:none;background:#777}
header a{color:var(--panel);font-size:13px;white-space:nowrap}

#app{display:grid;grid-template-columns:340px minmax(420px,1fr) 400px;gap:8px;padding:8px;height:calc(100vh - 48px)}
.col{min-height:0;display:flex;flex-direction:column;gap:8px;overflow:auto}
.panel{background:var(--panel);border:1px solid var(--ink)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--ink);font:700 14px var(--head);letter-spacing:.06em;text-transform:uppercase}
.ph .tog button{padding:1px 8px;font-size:12px}

/* leaderboard */
#board{flex:none}
#rows{position:relative;height:calc(22*28px)}
.row{position:absolute;left:0;right:0;height:28px;display:grid;grid-template-columns:28px 5px 44px 1fr 52px 20px;align-items:center;gap:6px;padding:0 8px 0 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:transform .35s ease;background:var(--panel)}
.row:hover{background:#cdcdc6}
.row.sel{background:var(--ink);color:var(--panel)}
.row.out{opacity:.55}
.row .pos{font:700 16px var(--head);text-align:right}
.row .bar{height:18px}
.row .code{font:700 16px var(--head);letter-spacing:.03em}
.row .gap{font:500 12px var(--mono);text-align:right}
.row .tyre{display:flex;align-items:center;gap:4px;font:500 11px var(--mono);justify-content:flex-end}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);display:inline-block;flex:none}
.row.sel .dot{border-color:var(--panel)}
.row .pits{font:500 11px var(--mono);text-align:center;color:var(--mute)}
.row.sel .pits{color:#aaa}
.row.pin .code::after{content:'*';margin-left:2px}

/* middle */
#tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:none}
.tile{background:var(--panel);border:1px solid var(--ink);padding:6px 8px;min-height:92px;position:relative}
.tile.empty{display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px;text-align:center;border-style:dashed}
.tile .t1{display:flex;justify-content:space-between;align-items:baseline}
.tile .tc{font:700 20px var(--head);border-left:5px solid var(--c);padding-left:6px}
.tile .tp{font:700 16px var(--head)}
.tile .tv{display:flex;justify-content:space-between;font:500 12px var(--mono);margin-top:3px}
.tile .tv b{font:700 20px var(--head)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.bar2{height:6px;background:#b4b4ad}.bar2 i{display:block;height:100%;width:0}
.bar2.t i{background:var(--inter)}.bar2.b i{background:var(--soft)}
.tile .unpin{position:absolute;right:2px;top:-1px;border:0;background:none;padding:0 4px;color:var(--mute);font-size:14px}
#mapwrap{flex:1;min-height:260px;display:flex;flex-direction:column}
#map{flex:1;min-height:0;width:100%}
#map text{font:600 8px var(--mono);fill:var(--ink)}
#controls{flex:none;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ctl .grow{flex:1}
#clock{font:500 14px var(--mono)}
#lapc{font:700 18px var(--head)}
#scrub{position:relative;height:34px}
#scrub input{position:absolute;left:0;right:0;top:14px;width:100%;margin:0;accent-color:var(--ink)}
#marks{position:absolute;left:0;right:0;top:0;height:14px;pointer-events:none}
#marks i{position:absolute;top:0;width:2px;height:12px;background:var(--ink);opacity:.55}
#marks i.sc{background:var(--med);opacity:1;width:3px}
#marks i.yellow{background:var(--med);opacity:1}
#marks i.out{background:var(--soft);opacity:1;width:3px}
#marks i.flag{background:var(--ink);opacity:1;width:3px}
#marks i.hit{pointer-events:auto;cursor:pointer}

/* right */
.vid{flex:none}
.vbox{position:relative;aspect-ratio:16/9;background:var(--ink);overflow:hidden}
.vbox .stage,.vbox .stage video,.vbox .stage iframe,.vbox .stage div{position:absolute;inset:0;width:100%;height:100%;border:0}
.vbox .card{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#cfd0cc;text-align:center;padding:10px}
.vbox .card .cc{font:700 40px var(--head);color:#fff;letter-spacing:.05em}
.vbox .card a{color:#fff;font-size:13px}
.vbox .ov{position:absolute;left:8px;bottom:8px;background:rgba(20,22,26,.82);color:#fff;font:600 13px var(--mono);padding:3px 8px;border-left:4px solid var(--c,#fff);display:flex;gap:10px;pointer-events:none}
.vbox .ov2{position:absolute;right:8px;top:8px;background:rgba(20,22,26,.82);color:#fff;font:500 12px var(--mono);padding:3px 8px;pointer-events:none;max-width:70%;text-align:right}
.vbox.cut .stage{opacity:.2}
.vbox .stage{transition:opacity .12s}
.vcap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 10px;font:500 11px var(--mono);color:var(--mute);border-top:1px solid var(--ink);flex-wrap:wrap}
.vcap button{padding:1px 8px;font-size:12px}

#radio{flex:none}
#radioList{max-height:220px;overflow:auto}
.msg{display:grid;grid-template-columns:62px 38px 1fr;gap:6px;padding:5px 10px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.msg:hover{background:#cdcdc6}
.msg.new{animation:slide .35s ease}
@keyframes slide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.msg .mt{font:500 11px var(--mono);color:var(--mute)}
.msg .mc{font:700 15px var(--head);border-left:4px solid var(--c);padding-left:5px}
.msg .mw{font:600 10px var(--mono);letter-spacing:.05em;color:var(--mute)}
.msg .tx{font-size:13px}
.msg.live .wave{display:inline-flex}
.wave{display:none;gap:2px;align-items:flex-end;height:12px;margin-left:6px;vertical-align:middle}
.wave i{width:3px;background:var(--ink);animation:wv .5s infinite alternate}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.05s}.wave i:nth-child(5){animation-delay:.15s}
@keyframes wv{from{height:3px}to{height:12px}}
.msg button.play{padding:0 6px;font-size:11px;margin-left:6px}
.empty-note{padding:10px;color:var(--mute);font-size:13px}

#driver{flex:none}
#driver .dh{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line)}
#driver .dn{font:700 30px var(--head);border-left:6px solid var(--c);padding-left:8px;line-height:1}
#driver .dm{font-size:12px;color:var(--mute)}
#driver .dp{margin-left:auto;font:700 28px var(--head)}
.sec{padding:8px 10px;border-bottom:1px solid var(--line)}
.sec h4{font:700 12px var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kv div{font:500 12px var(--mono)}.kv b{display:block;font:700 18px var(--head)}
.stintbar{display:flex;height:12px;border:1px solid var(--ink);margin-top:4px}
.stintbar i{display:block;height:100%;border-right:1px solid var(--ink)}
.tel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tel div{font:500 11px var(--mono);color:var(--mute)}.tel b{display:block;font:700 20px var(--head);color:var(--ink)}
table{width:100%;border-collapse:collapse;font:500 11px var(--mono)}
th{font-weight:500;color:var(--mute);text-align:right;padding:2px 3px}
td{text-align:right;padding:2px 3px;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td.p{color:var(--purple);font-weight:500}td.g{color:var(--green);font-weight:500}
#lapwrap{max-height:170px;overflow:auto}
#pitbox .read{font-size:13px;margin-top:4px}
#dradio .msg{grid-template-columns:62px 1fr;padding:4px 0}
#dradio .msg .mc,#dradio .msg .mw{display:none}

#tabs{display:none}
@media (max-width:1100px){
  body{overflow:auto}
  #app{display:grid;grid-template-columns:minmax(260px,330px) 1fr;height:auto}
  .col{overflow:visible}
  #colRight{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;align-items:start}
  #vidBox{display:flex;flex-direction:column;gap:8px}
  #radioBox{display:flex;flex-direction:column;gap:8px}
  #mapwrap{min-height:320px}
}
@media (max-width:700px){
  header{flex-wrap:wrap;height:auto;padding:6px 10px;gap:6px}
  #ticker{order:9;flex-basis:100%}
  #app{display:block;padding:8px 8px 64px}
  #app .col{display:none}
  #colRight{display:none;grid-template-columns:1fr}
  body[data-tab=map] #colMid{display:flex}
  body[data-tab=board] #colBoard{display:flex}
  body[data-tab=video] #colRight,body[data-tab=radio] #colRight{display:flex}
  body[data-tab=video] #radioBox{display:none}
  body[data-tab=radio] #vidBox{display:none}
  #tiles{grid-template-columns:repeat(2,1fr)}
  #tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--ink);z-index:5}
  #tabs button{flex:1;background:none;color:var(--panel);border:0;padding:14px 0;font:700 15px var(--head);letter-spacing:.06em;text-transform:uppercase}
  #tabs button.on{background:var(--panel);color:var(--ink)}
}
</style>
</head>
<body data-tab="map">
<header>
  <div class="logo">Paddock Pulse</div>
  <select id="raceSel" aria-label="Race"></select>
  <span id="badge" class="badge sim">SIMULATED</span>
  <div id="ticker"><span id="tickFlag"></span><span id="tickMsg">Waiting for lights out</span></div>
  <a href="https://f1tv.formula1.com" target="_blank" rel="noopener">Watch on F1 TV</a>
</header>

<div id="app">
  <section class="col" id="colBoard">
    <div class="panel" id="board">
      <div class="ph"><span>Leaderboard</span><span class="tog"><button id="gapBtn">Interval</button></span></div>
      <div id="rows"></div>
    </div>
  </section>

  <section class="col" id="colMid">
    <div id="tiles"></div>
    <div class="panel" id="mapwrap">
      <div class="ph"><span id="trackName">Track</span><span class="mono" id="lapc2" style="font-size:12px;letter-spacing:0"></span></div>
      <svg id="map" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="panel" id="controls">
      <div class="ctl">
        <button id="playBtn" style="min-width:64px">Play</button>
        <button id="liveBtn" style="display:none">Go live</button>
        <span id="speeds"></span>
        <span class="grow"></span>
        <span id="lapc">Lap 0 / 0</span>
        <span id="clock">0:00:00</span>
      </div>
      <div id="scrub"><div id="marks"></div><input id="scrubIn" type="range" min="0" max="1000" value="0" aria-label="Race position"></div>
    </div>
  </section>

  <section class="col" id="colRight">
    <div id="vidBox" style="display:contents">
      <div class="panel vid" id="onboard">
        <div class="ph"><span>Onboard</span><span class="mono" id="obWho" style="font-size:12px;letter-spacing:0"></span></div>
        <div class="vbox"><div class="stage"></div><div class="card"></div><div class="ov"></div></div>
        <div class="vcap"><span class="cap">Source: none</span><button class="mute">Sound off</button></div>
      </div>
      <div class="panel vid" id="broadcast">
        <div class="ph"><span>Broadcast</span><span class="tog"><button id="followBtn">Follow action</button> <button id="backBtn" style="display:none">Back to my driver</button></span></div>
        <div class="vbox"><div class="stage"></div><div class="card"></div><div class="ov2"></div></div>
        <div class="vcap"><span class="cap">Source: none</span><button class="mute">Sound off</button></div>
      </div>
    </div>
    <div id="radioBox" style="display:contents">
      <div class="panel" id="radio">
        <div class="ph"><span>Team radio</span><span class="mono" style="font-size:11px;letter-spacing:0" id="radioCount"></span></div>
        <div id="radioList"></div>
      </div>
      <div class="panel" id="driver"></div>
    </div>
  </section>
</div>
<nav id="tabs"><button data-tab="map" class="on">Map</button><button data-tab="board">Board</button><button data-tab="video">Video</button><button data-tab="radio">Radio</button></nav>

const TRACK_ALIAS={"melbourne":"melbourne|albert park","bahrain":"sakhir|bahrain","shanghai":"shanghai","barcelona":"catalunya|barcelona","monaco":"monaco|monte carlo","montreal":"montreal|villeneuve","spielberg":"spielberg|red bull ring","silverstone":"silverstone","budapest":"hungaroring|budapest","spafrancorchamps":"spa","monza":"monza","singapore":"singapore|marina bay","suzuka":"suzuka","austin":"austin|americas","mexicocity":"mexico","saopaulo":"interlagos|sao paulo","yasmarina":"yas","imola":"imola","zandvoort":"zandvoort","jeddah":"jeddah","miami":"miami","lusail":"lusail|losail","madrid":"madrid|madring","baku":"baku","lasvegas":"las vegas"};
let track=null; // {path,samples:[{x,y}],speed:[],L}
function buildTrack(key){
  const T=TRACKS[key]||TRACKS.generic, P=T.pts, n=P.length;
  const ys=P.map(p=>p[1]), maxY=Math.max(...ys), minY=Math.min(...ys), xs=P.map(p=>p[0]);
  const pt=i=>{const p=P[(i+n)%n];return[p[0],maxY+minY-p[1]]}; // flip y
  let d='M'+pt(0).join(' ');
  for(let i=0;i<n;i++){
    const p0=pt(i-1),p1=pt(i),p2=pt(i+1),p3=pt(i+2);
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0]} ${p2[1]}`;
  }
  d+='Z';
  const svg=$('#map'); svg.innerHTML='';
  const pad=50; svg.setAttribute('viewBox',`${Math.min(...xs)-pad} ${minY-pad} ${Math.max(...xs)-Math.min(...xs)+2*pad} ${maxY-minY+2*pad}`);
  const mk=(tag,a)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e};
  mk('path',{d,fill:'none',stroke:'#14161a','stroke-width':16,'stroke-linejoin':'round'});
  const main=mk('path',{d,fill:'none',stroke:'#e9e9e3','stroke-width':11,'stroke-linejoin':'round'});
  const L=main.getTotalLength(), N=1200, S=[];
  for(let i=0;i<N;i++){const q=main.getPointAtLength(i/N*L);S.push({x:q.x,y:q.y})}
  const q0=S[0],q1=S[3]; const ang=Math.atan2(q1.y-q0.y,q1.x-q0.x)*180/Math.PI;
  mk('rect',{x:q0.x-2,y:q0.y-11,width:4,height:22,fill:'#14161a',transform:`rotate(${ang} ${q0.x} ${q0.y})`});
  // speed profile from curvature
  const W=6, v=new Array(N);
  for(let i=0;i<N;i++){
    const a=S[(i-W+N)%N],b=S[i],c=S[(i+W)%N];
    let a1=Math.atan2(b.y-a.y,b.x-a.x),a2=Math.atan2(c.y-b.y,c.x-b.x),da=Math.abs(a2-a1);if(da>Math.PI)da=2*Math.PI-da;
    v[i]=clamp(335/(1+Math.pow((da*180/Math.PI*2)/45,1.2)),68,335);
  }
  for(let k=0;k<2;k++){
    for(let i=N*2-1;i>=0;i--){const j=i%N,nx=(j+1)%N;v[j]=Math.min(v[j],v[nx]+9)}
    for(let i=0;i<N*2;i++){const j=i%N,pv=(j-1+N)%N;v[j]=Math.min(v[j],v[pv]+3.6)}
  }
  track={S,v,N,L,key};
  $('#trackName').textContent=T.name;
  const g=mk('g',{id:'cars'});

function simRace(key){
  const cfg=RACES[key], rng=mulberry(cfg.seed), T=cfg.laps;
  let ds=GRID.map(g=>({code:g[0],num:g[1],first:g[2],last:g[3],teamKey:g[4],team:TEAMS[g[4]][0],color:TEAMS[g[4]][1],pace:TEAMS[g[4]][2]+(rng()-.5)*.5,cum:[],lapTimes:[],sectors:[],stints:[],pits:[],retired:false}));
  ds.sort((a,b)=>a.pace-b.pace+(rng()-.5)*.4);

  // strategy
  const COMP2=[['M','H','M'],['S','M','H'],['M','H','H'],['S','H','M']], COMP1=[['M','H'],['H','M']];
  for(const d of ds){
    let laps,cmp;
    if(rng()<.3){laps=[Math.round(22+rng()*6)];cmp=COMP1[(rng()*2)|0]}
    else{laps=[Math.round(14+rng()*5),Math.round(33+rng()*7)];cmp=COMP2[(rng()*4)|0]}
    if(rng()<.5){laps=laps.map(l=>Math.abs(l-cfg.sc[0])<=6?cfg.sc[0]:l)}
    laps=[...new Set(laps)].sort((a,b)=>a-b);
    let a=1;d.stints=[];
    laps.forEach((p,i)=>{d.stints.push({c:cmp[i],a,b:p});a=p+1});
    d.stints.push({c:cmp[laps.length],a,b:T});
    d.plan=laps;
    const r=cfg.retire[d.code]; if(r){d.retireLap=r[0];d.retireWhy=r[1]}
  }
  const DEG={S:.075,M:.045,H:.03},OFF={S:-.6,M:0,H:.5};
  const cur=new Map(ds.map(d=>[d,d.t0]));
  const tyreOf=(d,n)=>d.stints.find(s=>n>=s.a&&n<=s.b)||d.stints[d.stints.length-1];
  const scSet=n=>n>=cfg.sc[0]&&n<=cfg.sc[1];
  for(let n=1;n<=T;n++){
    const alive=ds.filter(d=>!d.retireLap||n<d.retireLap).sort((a,b)=>cur.get(a)-cur.get(b));
    let ref=null,refStart=0;
    for(const d of alive){
      const st=tyreOf(d,n),age=n-st.a;
      let lt=cfg.base+d.pace+OFF[st.c]+DEG[st.c]*age-.035*(n-1)+(rng()-.5)*.55;
      if(n===1)lt+=5.2;
      const sc=scSet(n); if(sc)lt=cfg.base*1.4+rng()*.4;
      const pit=d.plan.includes(n); let stat=0;
      if(pit){stat=2+rng()*1.2;lt+=(sc?11:20.5)+stat;d.pits.push({lap:n,stat})}
      const start=n===1?d.t0:cur.get(d); let end=start+lt;
      if(ref&&!pit){
        if(sc)end=ref.end+.7+rng()*.5;
        else if(end<ref.end+.5&&start-refStart<1.5&&rng()<.82)end=ref.end+.35+rng()*.3;
      }
      d.cum.push(end);d.lapTimes.push(end-start);
      const a=.3+(rng()-.5)*.02,b=.36+(rng()-.5)*.02,lt2=end-start;
      d.sectors.push([lt2*a,lt2*b,lt2*(1-a-b)]);
      cur.set(d,end);
      if(!pit){ref={end};refStart=start}
    }
  }
  ds.forEach(d=>{if(d.retireLap){d.retired=true;d.stopFrac=cfg.stopFrac}});
  // classified finish: leader's finish time
  const leaderFinish=Math.min(...ds.filter(d=>!d.retired).map(d=>d.cum[T-1]));
  for(const d of ds){
    if(d.retired)continue;
    let keep=0;for(let i=0;i<d.cum.length;i++){const s=i?d.cum[i-1]:d.t0;if(s<leaderFinish)keep=i+1}
    d.cum.length=keep;d.lapTimes.length=keep;d.sectors.length=keep;
  }
  const lead=ds.find(d=>!d.retired&&d.cum.length===T)||ds[0];
  const lapStart=n=>n<=1?0:lead.cum[Math.min(n-2,lead.cum.length-1)];
  const ev=[];
  ev.push({t:0,lap:1,flag:'green',msg:'LIGHTS OUT AND AWAY WE GO'});
  const yl=Math.round(cfg.sc[0]/2);ev.push({t:lapStart(yl)+40,lap:yl,flag:'yellow',msg:'YELLOW IN TRACK SECTOR 2',sector:2},{t:lapStart(yl)+62,lap:yl,flag:'green',msg:'CLEAR IN TRACK SECTOR 2'});
  ev.push({t:lapStart(cfg.sc[0])+15,lap:cfg.sc[0],flag:'sc',msg:'SAFETY CAR DEPLOYED'});
  ev.push({t:lapStart(cfg.sc[1]+1)-20,lap:cfg.sc[1],flag:'sc',msg:'SAFETY CAR IN THIS LAP'});
  ev.push({t:lapStart(cfg.sc[1]+1)+25,lap:cfg.sc[1]+1,flag:'green',msg:'GREEN FLAG - TRACK CLEAR'});
  for(const d of ds)if(d.retired){const t=d.cum[d.cum.length-1]+(d.cum.length?30:0);ev.push({t,lap:d.retireLap,flag:'out',msg:`CAR ${d.num} (${d.code}) STOPPED ON TRACK - ${d.retireWhy}`,code:d.code})}
  ev.push({t:lead.cum[T-1],lap:T,flag:'chequered',msg:'CHEQUERED FLAG'});
  ev.sort((a,b)=>a.t-b.t);
  return {key,name:cfg.name,track:cfg.track,totalLaps:T,drivers:ds,events:ev,live:false,duration:Math.max(...ds.map(d=>d.cum[d.cum.length-1]))+8};
}

/* ============ OpenF1 (queued, retried) ============ */
let OF1='https://api.openf1.org/v1',CFG={live:false};
let of1Last=0,of1Chain=Promise.resolve();
function of1(path){
  const run=async()=>{
    for(let a=0;a<4;a++){
      const wait=of1Last+380-Date.now();if(wait>0)await new Promise(r=>setTimeout(r,wait));
      of1Last=Date.now();
      try{
        const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);
        const r=await fetch(OF1+path,{signal:ctl.signal});clearTimeout(to);
        if(r.status===429){await new Promise(r=>setTimeout(r,1200*(a+1)));continue}
        if(!r.ok)throw new Error('HTTP '+r.status);
        return await r.json();
      }catch(e){if(a===3)throw e;await new Promise(r=>setTimeout(r,500*(a+1)))}
    }
  };
  const p=of1Chain.then(run);of1Chain=p.catch(()=>{});return p;
}

/* ============ race maths ============ */
let race=null;
function distAt(d,t){
  if(t<d.t0)return -d.grid*1e-3;

  const s=lo?c[lo-1]:d.t0;return lo+(t-s)/(c[lo]-s);
}
function timeAt(d,dist){
  const c=d.cum;if(dist<=0)return d.t0;
  if(dist>=c.length)return c[c.length-1];
  const k=Math.floor(dist),s=k?c[k-1]:d.t0;return s+(dist-k)*(c[k]-s);
}
let snapCache={t:-1,v:null};
function snapshot(t){
  if(snapCache.t===t&&snapCache.r===race)return snapCache.v;
  const L=race.drivers.map(d=>({d,dist:distAt(d,t)}));
  L.sort((a,b)=>b.dist-a.dist||a.d.grid-b.d.grid);
  const lead=L[0];
  L.forEach((x,i)=>{
    x.pos=i+1;x.ahead=i?L[i-1]:null;x.behind=L[i+1]||null;
    x.laps=Math.max(0,Math.floor(x.dist));
    x.out=x.d.retired&&x.dist>=x.d.cum.length;
    x.fin=!x.d.retired&&x.dist>=x.d.cum.length&&x.d.cum.length>0;
    const gapTo=o=>{if(!o||t<=x.d.t0+1)return{s:null,l:0};const l=Math.floor(o.dist-x.dist+1e-9);if(l>=1)return{s:null,l};return{s:Math.max(0,t-timeAt(o.d,x.dist)),l:0}};
    x.int=gapTo(x.ahead);x.gap=gapTo(lead===x?null:lead);
  });

}
function tyreAt(d,lap){const s=d.stints.find(s=>lap>=s.a&&lap<=s.b)||d.stints[d.stints.length-1];return{c:s.c,age:lap-s.a+(s.age0||0),stint:d.stints.indexOf(s)+1,s}}

  for(const e of race.events){
    const L=snapshot(Math.max(0,e.t));
    if(e.flag==='sc'&&!/IN THIS LAP/.test(e.msg)){L.slice(0,6).forEach((x,i)=>add(e.t+2+i*1.6,x.d,'ENGINEER',fill(pickLine(BANK.sc.e,x.d,last),{})))}

    if(e.flag==='yellow'){L.slice(2,4).forEach((x,i)=>add(e.t+2+i*2,x.d,'ENGINEER',fill(pickLine(BANK.yellow.e,x.d,last),{sec:e.sector||2})))}

  }
  out.sort((a,b)=>a.t-b.t);

  const lastTx=new Map(),res=[];
  for(const m of out){if(lastTx.get(m.code)===m.text)continue;lastTx.set(m.code,m.text);res.push(m)}
  if(race.realRadio){
    for(const m of res){const r=race.realRadio.filter(y=>y.num===m.num&&Math.abs(y.t-m.t)<45).sort((a,b)=>Math.abs(a.t-m.t)-Math.abs(b.t-m.t))[0];if(r)m.audio=r.url}
  }
  return res;
}

const ytq=[];let ytBroken=false;
function loadYT(cb){

  if(!ytq.length){const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>{ytBroken=true};document.head.appendChild(s);window.onYouTubeIframeAPIReady=()=>ytq.splice(0).forEach(f=>f())}
  ytq.push(cb);

let muted=true;
function makePlayer(root,kind){
  const box=root.querySelector('.vbox'),stage=root.querySelector('.stage'),card=root.querySelector('.card'),cap=root.querySelector('.cap'),ovEl=root.querySelector('.ov,.ov2');
  let key='',clip=null,vid=null,yt=null,ytReady=false,bad=false,lastSync=-9;
  const F1TV='https://f1tv.formula1.com';
  function showCard(code,text){
    card.style.display='flex';stage.style.display='none';
    card.innerHTML='';card.append(el('div','cc',code||''),el('div','',text),Object.assign(el('a','','Open on F1 TV'),{href:F1TV,target:'_blank',rel:'noopener'}));
    cap.textContent='Source: none for this moment';
  }
  function teardown(){stage.innerHTML='';vid=null;yt=null;ytReady=false;bad=false}
  function pick(clock,num,focus){
    const m=MANIFEST[race.key];if(!m)return null;
    const list=kind==='onboard'?((m.onboard&&m.onboard[num])||[]):(m.broadcast||[]);
    const ok=list.filter(c=>clock>=c.raceTimeStart&&clock<c.raceTimeEnd);
    return (kind==='broadcast'&&focus&&ok.find(c=>c.focus===focus))||ok[0]||null;
  }
  function setClip(c,label){
    box.classList.add('cut');setTimeout(()=>box.classList.remove('cut'),120);
    teardown();clip=c;
    if(!c){showCard(label.code,label.text);return}
    card.style.display='none';stage.style.display='block';
    if(c.file){
      vid=document.createElement('video');vid.muted=true;vid.playsInline=true;vid.preload='auto';vid.src=c.file;
      vid.onerror=()=>{bad=true;showCard(label.code,label.text)};
      stage.appendChild(vid);cap.textContent='Source: local clip '+c.file.split('/').pop();
    }else if(c.youtube){
      cap.textContent='Source: YouTube embed '+c.youtube;
      if(ytBroken){showCard(label.code,label.text);return}
      const holder=el('div');stage.appendChild(holder);const mine=stage;
      loadYT(()=>{
        if(stage!==mine||clip!==c)return;
        yt=new YT.Player(holder,{videoId:c.youtube,playerVars:{controls:0,modestbranding:1,rel:0,playsinline:1,mute:1,start:Math.max(0,Math.floor(c.videoStart||0))},events:{onReady:()=>{ytReady=true},onError:()=>{bad=true;showCard(label.code,label.text)}}});
      });
    }
  }
  function tick(clock,playing,rate,num,focus,label,overlay){
    const c=pick(clock,num,focus),k=c?(c.file||c.youtube)+'|'+c.raceTimeStart:'none|'+label.code;
    if(k!==key){key=k;setClip(c,label)}
    if(ovEl&&overlay){const s=overlay.text;if(ovEl.dataset.s!==s){ovEl.dataset.s=s;ovEl.textContent=s;if(overlay.color)ovEl.style.setProperty('--c',overlay.color)}}
    if(!clip||bad)return;
    const target=clock-clip.raceTimeStart+(clip.videoStart||0),r=Math.min(rate,2),mute=muted||rate>2;
    if(vid){
      vid.muted=mute;if(vid.playbackRate!==r)vid.playbackRate=r;
      if(vid.readyState>0&&Math.abs(vid.currentTime-target)>1.5)vid.currentTime=target;
      if(playing&&vid.paused)vid.play().catch(()=>{});else if(!playing&&!vid.paused)vid.pause();
    }else if(yt&&ytReady){
      try{
        mute?yt.mute():yt.unMute();yt.setPlaybackRate(r);
        if(Math.abs(yt.getCurrentTime()-target)>1.5&&performance.now()-lastSync>1500){yt.seekTo(target,true);lastSync=performance.now()}
        const st=yt.getPlayerState();if(playing&&st!==1)yt.playVideo();else if(!playing&&st===1)yt.pauseVideo();
      }catch(e){}
    }
  }
  root.querySelector('.mute').onclick=()=>{muted=!muted;document.querySelectorAll('.vcap .mute').forEach(b=>b.textContent=muted?'Sound off':'Sound on')};
  return{tick};
}

function strategy(x){
  if(x.out)return 'Car stopped.';
  const t=S.clock,lap=clamp(x.laps+1,1,race.totalLaps),me=tyreAt(x.d,lap);
  if(scActive(t))return 'Safety car. Gaps are closed, a stop now costs less time.';
  if(x.ahead&&x.int.s!=null&&x.int.s<2.5){
    const ot=tyreAt(x.ahead.d,clamp(Math.floor(x.ahead.dist)+1,1,race.totalLaps)),diff=ot.age-me.age;
    if(diff>=4)return `Undercut window open, ${x.int.s.toFixed(1)}s behind ${x.ahead.d.code}, ${diff} laps older tyres on his car.`;
    if(x.int.s<1)return `In DRS range of ${x.ahead.d.code}, ${x.int.s.toFixed(1)}s. Pick the exit of the last corner.`;
  }
  if(x.behind&&x.behind.int.s!=null&&x.behind.int.s<1.2)return `${x.behind.d.code} is ${x.behind.int.s.toFixed(1)}s back. Cover the inside line.`;
  const nextPit=x.d.pits.find(p=>p.lap>x.laps);
  if(nextPit)return `Plan: next stop around lap ${nextPit.lap}. ${me.age} laps on the ${TYRE_NAME[me.c]}s.`;
  return `Clean air. ${me.age} laps on the ${TYRE_NAME[me.c]}s, nothing to report.`;
}

/* ============ loop ============ */
let lastTs=0;
function frame(ts){
  const dt=lastTs?(ts-lastTs)/1000:0;lastTs=ts;
  if(race){
    if(race.isNow)race.duration=(Date.now()-race.t0abs)/1000;
    if(race.isNow&&S.atLive){S.clock=race.duration;S.playing=true;S.rate=1}
    else if(S.playing){S.clock+=dt*S.rate;if(S.clock>=race.duration){S.clock=race.duration;S.playing=false}}
    $('#liveBtn').style.display=race.isNow?'':'none';$('#liveBtn').classList.toggle('on',!!S.atLive);
    const t=S.clock,L=snapshot(t);
    renderBoard(L,t);renderTiles(L,t);renderMap(L);renderClock(L,t);renderRadio(t);renderDriver(L,t);
    renderVideo(L,t);
  }
  requestAnimationFrame(frame);
}
function renderVideo(L,t){
  const x=L.find(y=>y.d.code===S.sel),tm=telemetry(x,t);
  pOn.tick(t,S.playing,S.rate,x.d.num,null,{code:x.d.code,text:'No onboard for this moment'},{text:`${x.d.code}   P${x.pos}   ${tm.speed} km/h   G${tm.gear}`,color:x.d.color});

    let best=null;for(const y of L){if(y.out||y.pos===1||y.int.s==null)continue;if(!best||y.int.s<best.int.s)best=y}
    if(best){focusCode=best.d.code;label=`Battle: ${best.ahead.d.code} v ${best.d.code}  ${best.int.s.toFixed(1)}s`}
  }else label=`Lap ${clamp(Math.floor(L[0].dist)+1,1,race.totalLaps)} / ${race.totalLaps}   ${fmtClock(t)}`;
  const ev=[...race.events].reverse().find(e=>e.t<=t);
  pBc.tick(t,S.playing,S.rate,null,focusCode,{code:'',text:'No broadcast clip for this moment'},{text:label+(ev?'\n'+ev.msg:'')});
  $('#obWho').textContent=x.d.code+' '+x.d.last;
}

/* ============ race loading ============ */

  try{
    if(key.startsWith('of1_')){
      $('#badge').textContent='LOADING';$('#badge').className='badge sim';
      if(key==='of1_live'){
        const sess=(await of1('/sessions?session_key=latest'))[0];
        race=await loadReal(sess,true);
      }else race=await loadReal(sessions.find(s=>'of1_'+s.session_key===key));
    }else race=simRace(key);
  }catch(e){
    console.warn('OpenF1 load failed, using simulated',e);
    race=simRace('austin');sel.value='austin';
  }
  race.radio=null;
  buildTrack(race.track);carEls={};rows={};snapCache.t=-1;
  S.clock=0;S.pins=[];S.atLive=!!race.isNow;if(race.isNow)S.playing=true;
  if(!race.drivers.some(d=>d.code===S.sel))S.sel=race.drivers[0].code;
  $('#badge').textContent=race.isNow?'LIVE NOW':race.live?'OPENF1 REPLAY':'SIMULATED';$('#badge').className='badge '+(race.live?'live':'sim');
  buildRows();buildMarks();
  radioMsgs=genRadio();radioShown=0;radioKey='';panelKey='';
  $('#tiles')._k=null;
}

let sessions=[];
async function loadSessions(){
  try{
    const s=await of1('/sessions?session_name=Race&year=2025');
    sessions=s.filter(x=>x.session_key).sort((a,b)=>a.date_start<b.date_start?-1:1);
    const sel=$('#raceSel');
    if(CFG.live){const o=el('option','','Live now (latest session)');o.value='of1_live';sel.insertBefore(o,sel.firstChild)}
    sessions.forEach(x=>{const o=el('option','',`${x.year} ${x.country_name} GP (OpenF1)`);o.value='of1_'+x.session_key;sel.appendChild(o)});
  }catch(e){/* offline: simulated races only */}
}

/* ============ init ============ */
(function init(){
  const sel=$('#raceSel');
  for(const k in RACES){const o=el('option','',RACES[k].name);o.value=k;sel.appendChild(o)}
  sel.onchange=()=>loadRace(sel.value);
  const sp=$('#speeds');
  [1,2,5,10,30].forEach(r=>{const b=el('button',r===1?'on':'',r+'x');b.onclick=()=>{S.rate=r;sp.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))};sp.appendChild(b)});
  $('#playBtn').onclick=()=>{if(S.atLive){S.atLive=false;S.playing=false;return}if(S.clock>=race.duration&&!race.isNow)seek(0);S.playing=!S.playing};
  $('#liveBtn').onclick=()=>{S.atLive=true;S.playing=true;S.rate=1;snapCache.t=-1};
  setInterval(async()=>{ // live polling: reload laps, stints and race control, keep the playhead
    if(!race||!race.isNow)return;
    try{const n=await loadReal(race.sess,true);if(!n.isNow||race.key!==n.key)return;n.radio=null;race=n;snapCache.t=-1;buildMarks();
      pollN=(pollN||0)+1;if(pollN%3===0){radioMsgs=genRadio();radioKey=''}}catch(e){console.warn('live poll failed',e)}
  },6000);
  $('#scrubIn').oninput=e=>seek(e.target.value/1000*race.duration);
  $('#gapBtn').onclick=e=>{S.gapMode=S.gapMode==='int'?'gap':'int';e.target.textContent=S.gapMode==='int'?'Interval':'Gap to leader'};
  $('#followBtn').onclick=()=>{S.follow=!S.follow;$('#followBtn').classList.toggle('on',S.follow);$('#backBtn').style.display=S.follow?'':'none'};
  $('#backBtn').onclick=()=>{S.follow=false;$('#followBtn').classList.remove('on');$('#backBtn').style.display='none'};
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.body.dataset.tab=b.dataset.tab;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b))});
  $('#map').addEventListener('click',e=>{const g=e.target.closest('g');if(!g||!g.parentNode||g.id==='cars')return;const code=g.querySelector('text')?.textContent;if(code)e.shiftKey?pin(code):select(code)});
  pOn=makePlayer($('#onboard'),'onboard');pBc=makePlayer($('#broadcast'),'broadcast');
  document.addEventListener('keydown',e=>{
    if(!race||['SELECT','INPUT'].includes(e.target.tagName))return;
    if(e.code==='Space'){e.preventDefault();$('#playBtn').click()}
    else if(e.code==='ArrowLeft'){e.preventDefault();seek(S.clock-10)}
    else if(e.code==='ArrowRight'){e.preventDefault();seek(S.clock+10)}
    else if(e.code==='ArrowUp'||e.code==='ArrowDown'){e.preventDefault();const L=snapshot(S.clock),i=L.findIndex(x=>x.d.code===S.sel),j=clamp(i+(e.code==='ArrowDown'?1:-1),0,L.length-1);select(L[j].d.code)}
  });
  fetch('/config').then(r=>r.json()).then(c=>{if(c&&c.proxy){CFG=c;OF1='/openf1/v1'}}).catch(()=>{}).then(()=>
    loadRace('austin').then(()=>{requestAnimationFrame(frame);loadSessions()}));
})();
</script>
